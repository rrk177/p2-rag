name: p2-rag

services:
  minio:
    image: pgsty/silo:latest
    container_name: p2-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: p2-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    container_name: p2-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

  py:
    image: python:3.12-slim
    container_name: p2-py
    working_dir: /app
    volumes:
      - .:/app
      - hf-cache:/root/.cache/huggingface
    ports:
      - "8501:8501"
    command: sleep infinity
    depends_on: [minio, qdrant, ollama]

volumes:
  minio-data:
  qdrant-data:
  ollama-models:
  hf-cache:
